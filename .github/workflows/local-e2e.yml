name: Local E2E

on:
  workflow_dispatch:
  push:

jobs:
  mono-ci:
    runs-on: ubuntu-latest
    env:
      CI: true
    services:
      redis:
        image: redis:7.0-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 9.8.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts --no-optional # TODO: Remove ignore-scripts?

      - name: Setup environment variables
        run: |
          touch apps/server/.env
          echo SUPABASE_URL=${{ secrets.SUPABASE_URL }} >> .env
          echo SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }} >> .env
          echo SUPABASE_JWT_SECRET=${{ secrets.SUPABASE_JWT_SECRET }} >> .env
          echo PINO_LOG_LEVEL=debug >> .env
          echo CORS_ORIGINS=http://localhost:3000 >> .env
          echo API_KEY=${{ secrets.API_KEY }} >> .env
          cat .env

          touch apps/web/.env
          echo VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }} >> .env
          echo VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }} >> .env
          echo VITE_BASE_URL=${{ secrets.VITE_BASE_URL }} >> .env
          echo VITE_SERVER_URL=${{ secrets.VITE_SERVER_URL }} >> .env
          echo VITE_API_KEY=${{ secrets.VITE_API_KEY }} >> .env
          echo TEST_SUPABASE_URL=${{ secrets.TEST_SUPABASE_URL }} >> .env
          echo TEST_SUPABASE_SERVICE_ROLE_KEY=${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }} >> .env
          echo TEST_USER_PASSWORD=${{ secrets.TEST_USER_PASSWORD }} >> .env
          cat .env

          touch apps/web/.env.e2e
          echo TEST_SUPABASE_URL=${{ secrets.TEST_SUPABASE_URL }} >> .env
          echo TEST_SUPABASE_SERVICE_ROLE_KEY=${{ secrets.TEST_SUPABASE_SERVICE_ROLE_KEY }} >> .env
          echo TEST_USER_PASSWORD=${{ secrets.TEST_USER_PASSWORD }} >> .env
          cat .env.e2e

      - name: Build packages
        run: |
          pnpm common-dto build
          pnpm common-supabase build
          pnpm be-supabase build
          pnpm fe-supabase build

      - name: Server start
        run: pnpm run server dev

      - name: Web E2E tests
        run: pnpm run web e2e
