name: Local E2E

on:
  workflow_dispatch:
  push:

jobs:
  mono-local-e2e:
    runs-on: ubuntu-latest
    env:
      CI: true
    services:
      redis:
        image: redis:7.0-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm
        with:
          version: 9.8.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Setup environment variables
        run: |
          touch apps/server/.env
          # server
          echo PORT=8000 >> apps/server/.env
          echo SERVER_REGION=localhost >> apps/server/.env
          echo NODE_ENV=development >> apps/server/.env
          echo PINO_LOG_LEVEL=info >> apps/server/.env
          echo CORS_ORIGINS=http://localhost:3000 >> apps/server/.env
          echo API_KEY=testapikey >> apps/server/.env
          
          # redis
          echo REDIS_URL=redis://localhost:6379 >> apps/server/.env
          echo REDIS_PORT=6379 >> apps/server/.env
          echo REDIS_USERNAME= >> apps/server/.env
          echo REDIS_PASSWORD= >> apps/server/.env
          
          # supabase
          echo SUPABASE_DB_PWD=SUPABASE_DB_PWD >> apps/server/.env
          echo SUPABASE_ANON_PUB=${{ secrets.SUPABASE_ANON_KEY }} >> apps/server/.env
          echo SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }} >> apps/server/.env
          echo SUPABASE_URL=${{ secrets.SUPABASE_URL }} >> apps/server/.env
          echo SUPABASE_JWT_SECRET=${{ secrets.SUPABASE_JWT_SECRET }} >> apps/server/.env
          
          # socket-io
          echo ADMIN_UI_USERNAME=ADMIN_UI_USERNAME >> apps/server/.env
          echo ADMIN_UI_PASSWORD=ADMIN_UI_PASSWORD >> apps/server/.env
          cat apps/server/.env

          touch apps/web/.env
          echo VITE_SUPABASE_URL=${{ secrets.SUPABASE_URL }} >> apps/web/.env
          echo VITE_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} >> apps/web/.env
          echo VITE_BASE_URL=http://localhost:3000 >> apps/web/.env
          echo VITE_SERVER_URL=http://localhost:8000 >> apps/web/.env
          echo VITE_API_KEY=testapikey >> apps/web/.env
          cat apps/web/.env

          touch apps/web/.env.e2e
          echo TEST_SUPABASE_URL=${{ secrets.SUPABASE_URL }} >> apps/web/.env.e2e
          echo TEST_SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }} >> apps/web/.env.e2e
          echo TEST_USER_PASSWORD=${{ secrets.TEST_USER_PASSWORD }} >> apps/web/.env.e2e
          cat apps/web/.env.e2e

      - name: Build packages
        run: pnpm --filter "./packages/*" build

      - name: Server start
        run: |
          # Start server in background with logs
          nohup pnpm run server dev > server.log 2>&1 &
          SERVER_PID=$!
          echo "Server started with PID: $SERVER_PID"
          
          # Show logs in real-time while waiting for server to be ready
          timeout=30
          elapsed=0
          while [ $elapsed -lt $timeout ]; do
            # Check if server process is still running
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "❌ Server process died unexpectedly"
              echo "📋 Final server logs:"
              cat server.log
              exit 1
            fi
            
            # Show recent logs
            if [ -f server.log ]; then
              echo "📋 Server logs (last 10 lines):"
              tail -10 server.log
            fi
            
            # Check if server is ready
            if grep -q "Server is running on port 8000" server.log 2>/dev/null; then
              echo "✅ Server is ready!"
              break
            fi
            
            echo "⏳ Waiting for server... ($elapsed/$timeout seconds)"
            sleep 3
            elapsed=$((elapsed + 3))
          done
          
          if [ $elapsed -ge $timeout ]; then
            echo "❌ Server failed to start within $timeout seconds"
            echo "📋 Full server logs:"
            cat server.log
            exit 1
          fi

      - name: Web E2E tests
        run: pnpm run web e2e

      - name: Show server logs on failure
        if: failure()
        run: |
          echo "📋 Server logs for debugging:"
          cat server.log || echo "No server.log found"

      - name: Upload reports to GitHub Actions Artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.shardIndex }}
          path: apps/web/e2e/failed-e2e-results
          retention-days: 1
