services:
  redis:
    image: redis:7.4-alpine
    volumes:
      - redis_data:/data
    ports:
      - '6379:6379'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 2.8G
          cpus: '1.3'
        reservations:
          memory: 1.8G
          cpus: '0.4'

  backend:
    image: bengostar/vchat-service:latest
    ports:
      - '8000'
    environment:
      - PORT=${PORT}
      - SERVER_REGION=${SERVER_REGION}
      - NODE_ENV=${NODE_ENV}
      - PINO_LOG_LEVEL=${PINO_LOG_LEVEL}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - API_KEY=${API_KEY}
      - REDIS_URL=${REDIS_URL}
      - REDIS_PORT=${REDIS_PORT}
      - SUPABASE_DB_PWD=${SUPABASE_DB_PWD}
      - SUPABASE_ANON_PUB=${SUPABASE_ANON_PUB}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      - ADMIN_UI_USERNAME=${ADMIN_UI_USERNAME}
      - ADMIN_UI_PASSWORD=${ADMIN_UI_PASSWORD}
      # Docker-specific optimizations
      - NODE_OPTIONS=--max-old-space-size=1200
      - UV_THREADPOOL_SIZE=20
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 1.4G
          cpus: '0.8'
        reservations:
          memory: 900M
          cpus: '0.4'

  caddy:
    image: caddy:latest
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      - CADDY_EMAIL=${CADDY_EMAIL}
      - CADDY_DOMAIN=${CADDY_DOMAIN}
      - CADDY_PROXY_ADDRESS=backend:8000
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    healthcheck:
      test: ['CMD', 'caddy', 'validate', '--config', '/etc/caddy/Caddyfile']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.2'
        reservations:
          memory: 128M
          cpus: '0.1'

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    privileged: true
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    environment:
      # pass environment variables for config.alloy
      - ALLOY_SERVICE_NAME=${ALLOY_SERVICE_NAME}
      - ALLOY_METRICS_SERVICE_URL=${ALLOY_METRICS_SERVICE_URL}
      - ALLOY_METRICS_SERVICE_USERNAME=${ALLOY_METRICS_SERVICE_USERNAME}
      - ALLOY_METRICS_SERVICE_PASSWORD=${ALLOY_METRICS_SERVICE_PASSWORD}
      - ALLOY_LOKI_URL=${ALLOY_LOKI_URL}
      - ALLOY_LOKI_USERNAME=${ALLOY_LOKI_USERNAME}
      - ALLOY_LOKI_PASSWORD=${ALLOY_LOKI_PASSWORD}
    devices:
      - /dev/kmsg
    ports:
      - '12345:12345'
    command: >
      run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis_data:
  caddy_data:
    external: true
  caddy_config:
