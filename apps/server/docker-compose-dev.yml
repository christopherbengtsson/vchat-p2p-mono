# Docker Compose for Local Development Dependencies
# Only includes Redis and Cap.js - backend runs via pnpm
services:
  redis:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    ulimits:
      memlock: -1
    ports:
      - '6379:6379'
    command: --cluster_mode=emulated --lock_on_hashtags --default_lua_flags=allow-undeclared-keys
    volumes:
      - redis_dev_data:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  cap:
    image: tiago2/cap:latest
    ports:
      - '8001:3000'
    environment:
      - ADMIN_KEY=${CAP_ADMIN_KEY}
      - ENABLE_ASSETS_SERVER=false
      - CORS_ORIGIN=${CAP_CORS_ORIGINS}
    volumes:
      - cap_dev_data:/usr/src/app/.data
    restart: unless-stopped

volumes:
  redis_dev_data:
  cap_dev_data:
